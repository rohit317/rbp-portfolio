  <text x="1148" y="762" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" fill="#fde68a" font-weight="700" opacity="0.85">TXT · SVG · PNG · GIF · APNG</text>
