<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#451a03"/>
      <stop offset="0.55" stop-color="#92400e"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.45" stop-color="#b45309"/>
      <stop offset="1" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="190" cy="80" r="400" fill="url(#glow1)"/>
  <circle cx="1070" cy="750" r="380" fill="url(#glow2)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>

  <text x="52" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="6" fill="#fde68a">04 ASKEY</text>

  <!-- scanlines -->
  <rect x="0" y="127" width="1200" height="16" fill="url(#scan)" opacity="0.12"/>
  <rect x="0" y="134" width="1200" height="3" fill="url(#scan)" opacity="0.85"/>
  <rect x="0" y="721" width="1200" height="16" fill="url(#scan)" opacity="0.08"/>
  <rect x="0" y="728" width="1200" height="3" fill="url(#scan)" opacity="0.5"/>

  <!-- photo panel bleeding off the left edge -->
  <circle cx="250" cy="430" r="150" fill="url(#sunGlow)"/>
  <path d="M0 170 H410 Q440 170 440 200 V660 Q440 690 410 690 H0 Z" fill="url(#photo)"/>
  <circle cx="250" cy="430" r="68" fill="#fef3c7" opacity="0.95"/>
  <path d="M0 690 V565 L130 475 L265 595 L370 520 L440 570 V690 Z" fill="#451a03" opacity="0.85"/>
  <path d="M0 170 H410 Q440 170 440 200 V660 Q440 690 410 690 H0 Z" fill="none" stroke="#fcd34d" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- arrow -->
  <path d="M462 430 H556 M524 398 L556 430 L524 462" fill="none" stroke="#fbbf24" stroke-width="20" stroke-opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M462 430 H556 M524 398 L556 430 L524 462" fill="none" stroke="#fde68a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ascii panel bleeding off the right edge -->
  <path d="M1200 170 H620 Q580 170 580 200 V660 Q580 690 620 690 H1200 Z" fill="#1f1204" opacity="0.93"/>
  <path d="M1200 170 H620 Q580 170 580 200 V660 Q580 690 620 690 H1200 Z" fill="none" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="616" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2" fill="#fbbf24" opacity="0.6">$ askey photo.jpg --width 44</text>
