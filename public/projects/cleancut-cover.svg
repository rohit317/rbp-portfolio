<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#26246b"/>
      <stop offset="0.55" stop-color="#4338ca"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cutglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <pattern id="stripes" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="26" height="26" fill="#2c2c3e"/>
      <rect width="13" height="26" fill="#3a3a52"/>
    </pattern>
    <linearGradient id="subj" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <path id="spark" d="M0 -14 C1.6 -3.2 3.2 -1.6 14 0 C3.2 1.6 1.6 3.2 0 14 C-1.6 3.2 -3.2 1.6 -14 0 C-3.2 -1.6 -1.6 -3.2 0 -14 Z"/>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="990" cy="80" r="440" fill="url(#glow1)"/>
  <circle cx="120" cy="740" r="360" fill="url(#glow2)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>

  <text x="52" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="6" fill="#c7d2fe">06 CLEAN &amp; CUT</text>

  <!-- original: transparency-striped frame, blurry subject, rough selection -->
  <g>
    <rect x="110" y="185" width="400" height="430" rx="28" fill="url(#stripes)" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="310" cy="420" r="95" fill="url(#subj)" opacity="0.8" filter="url(#soften)"/>
    <circle cx="310" cy="420" r="112" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="7 8"/>
    <rect x="134" y="209" width="152" height="34" rx="17" fill="#0f0f1a" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.25"/>
    <text x="210" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2" font-weight="700" fill="#ffffff" opacity="0.8">ORIGINAL.JPG</text>
  </g>

  <!-- arrow -->
  <path d="M544 400 H660 M624 364 L660 400 L624 436" fill="none" stroke="#a5b4fc" stroke-width="22" stroke-opacity="0.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M544 400 H660 M624 364 L660 400 L624 436" fill="none" stroke="#c7d2fe" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cutout: glowing frame, crisp subject, marching-ants marquee -->
  <circle cx="890" cy="400" r="250" fill="url(#cutglow)"/>
  <g>
    <rect x="690" y="185" width="400" height="430" rx="28" fill="#15152a" stroke="#c7d2fe" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="890" cy="415" r="96" fill="url(#subj)"/>
    <circle cx="890" cy="415" r="96" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="722" y="217" width="336" height="366" rx="18" fill="none" stroke="#e0e7ff" stroke-width="2.5" stroke-dasharray="12 9">
      <animate attributeName="stroke-dashoffset" from="0" to="42" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="714" y="209" width="136" height="34" rx="17" fill="#4338ca" fill-opacity="0.55" stroke="#c7d2fe" stroke-opacity="0.5"/>
    <text x="782" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2" font-weight="700" fill="#e0e7ff">CUTOUT.PNG</text>
  </g>

  <use href="#spark" transform="translate(1104 164)" fill="#e0e7ff"/>
  <use href="#spark" transform="translate(664 648) scale(0.7)" fill="#c7d2fe"/>
  <use href="#spark" transform="translate(1100 644) scale(0.5)" fill="#a5b4fc"/>

  <text x="52" y="762" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" fill="#c7d2fe" font-weight="700" opacity="0.85">AI BACKGROUND REMOVER</text>
  <text x="1148" y="762" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" fill="#c7d2fe" font-weight="700" opacity="0.85">UPLOAD · PROCESS · DOWNLOAD</text>
</svg>
