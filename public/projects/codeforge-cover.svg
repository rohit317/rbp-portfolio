<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2a1065"/>
      <stop offset="0.55" stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#8b31c9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="braces" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d0fe"/>
      <stop offset="0.6" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="runbtn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="760" cy="60" r="480" fill="url(#glow1)"/>
  <circle cx="80" cy="740" r="360" fill="url(#glow2)"/>
  <rect width="1200" height="800" fill="url(#dots)"/>

  <text x="52" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="6" fill="#e9d5ff">02 CODEFORGE</text>

  <!-- perspective floor grid -->
  <g stroke="#f0abfc" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="-200" y1="800" x2="700" y2="560"/>
    <line x1="100" y1="800" x2="715" y2="560"/>
    <line x1="400" y1="800" x2="730" y2="560"/>
    <line x1="700" y1="800" x2="745" y2="560"/>
    <line x1="1000" y1="800" x2="760" y2="560"/>
    <line x1="1300" y1="800" x2="775" y2="560"/>
    <line x1="1600" y1="800" x2="790" y2="560"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="692" x2="1200" y2="692"/>
    <line x1="0" y1="758" x2="1200" y2="758"/>
  </g>

  <!-- giant braces -->
  <text x="90" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="380" font-weight="700" fill="url(#braces)">{</text>
  <text x="318" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="380" font-weight="700" fill="url(#braces)">}</text>

  <!-- editor window -->
  <g transform="rotate(2.5 930 340)">
    <rect x="680" y="190" width="470" height="300" rx="18" fill="#12081f" opacity="0.94"/>
    <rect x="680" y="190" width="470" height="300" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
    <line x1="680" y1="242" x2="1150" y2="242" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="710" cy="216" r="7" fill="#f87171"/>
    <circle cx="734" cy="216" r="7" fill="#fbbf24"/>
    <circle cx="758" cy="216" r="7" fill="#34d399"/>
    <text x="784" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#ffffff" opacity="0.55">solution.ts</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ffffff" opacity="0.35">
      <text x="712" y="286">1</text><text x="712" y="320">2</text><text x="712" y="354">3</text><text x="712" y="388">4</text><text x="712" y="422">5</text><text x="712" y="456">6</text>
    </g>
    <rect x="744" y="272" width="150" height="14" rx="7" fill="#c084fc"/>
    <rect x="906" y="272" width="96" height="14" rx="7" fill="#ffffff" opacity="0.16"/>
    <rect x="744" y="306" width="64" height="14" rx="7" fill="#f472b6"/>
    <rect x="820" y="306" width="182" height="14" rx="7" fill="#ffffff" opacity="0.22"/>
    <rect x="1014" y="306" width="54" height="14" rx="7" fill="#34d399"/>
    <rect x="744" y="340" width="36" height="14" rx="7" fill="#ffffff" opacity="0.16"/>
    <rect x="792" y="340" width="134" height="14" rx="7" fill="#fbbf24"/>
    <rect x="744" y="374" width="204" height="14" rx="7" fill="#ffffff" opacity="0.2"/>
    <rect x="960" y="374" width="44" height="14" rx="7" fill="#f472b6"/>
    <rect x="744" y="408" width="80" height="14" rx="7" fill="#34d399"/>
    <rect x="836" y="408" width="114" height="14" rx="7" fill="#ffffff" opacity="0.16"/>
    <rect x="744" y="442" width="52" height="14" rx="7" fill="#c084fc"/>
  </g>

  <!-- run button -->
  <g transform="rotate(-6 640 560)">
    <rect x="584" y="504" width="112" height="112" rx="30" fill="url(#runbtn)"/>
    <path d="M628 534 L668 560 L628 586 Z" fill="#ffffff"/>
  </g>

  <text x="52" y="762" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" fill="#e9d5ff" font-weight="700" opacity="0.85">REAL-TIME CODING PLATFORM</text>
  <text x="1148" y="762" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" fill="#e9d5ff" font-weight="700" opacity="0.85">JUDGE · ROOMS · Y.JS</text>
</svg>
